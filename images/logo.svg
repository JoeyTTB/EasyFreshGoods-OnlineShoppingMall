<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <style>
    .logo-text { font-family: 'Arial', sans-serif; font-weight: bold; }
    .primary-color { fill: #ff4757; }
    .secondary-color { fill: #1e90ff; }
  </style>
  
  <!-- 图标背景 -->
  <rect x="0" y="0" width="60" height="60" rx="10" fill="#fff" stroke="#ff4757" stroke-width="2"/>
  
  <!-- 购物袋 -->
  <path class="primary-color" d="M15 20h30v30a5 5 0 0 1-5 5H20a5 5 0 0 1-5-5V20z"/>
  
  <!-- 购物袋提手 -->
  <path class="secondary-color" d="M20 20c0-5.5 4.5-10 10-10s10 4.5 10 10" fill="none" stroke="#1e90ff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 生鲜标志 -->
  <circle cx="30" cy="35" r="10" fill="#fff"/>
  <path class="primary-color" d="M26 35c0-4 8-10 8-6 0 4-8 10-8 6z"/>
  <path class="secondary-color" d="M34 35c0-4-8-10-8-6 0 4 8 10 8 6z"/>
  
  <!-- 文字 -->
  <text x="70" y="35" class="logo-text primary-color" font-size="24">易优鲜</text>
  <text x="70" y="50" class="logo-text secondary-color" font-size="12">FRESH MARKET</text>
</svg> 